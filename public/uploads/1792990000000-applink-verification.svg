<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="16" fill="#FFFFFF"/>

  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1D2939">앱을 설치하거나 업데이트할 때 일어나는 일</text>

  <rect x="30" y="70" width="190" height="96" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="125" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2939">① 앱 설치</text>
  <text x="125" y="122" text-anchor="middle" font-size="12" fill="#475467">manifest에서</text>
  <text x="125" y="140" text-anchor="middle" font-size="12" fill="#475467">autoVerify가 붙은</text>
  <text x="125" y="158" text-anchor="middle" font-size="12" fill="#475467">도메인을 찾음</text>

  <line x1="220" y1="118" x2="280" y2="118" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="284" y="70" width="192" height="96" rx="12" fill="#EFF8FF" stroke="#B2DDFF"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2939">② 서버에 요청</text>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#175CD3" font-family="Menlo, monospace">links.example.com</text>
  <text x="380" y="142" text-anchor="middle" font-size="11" fill="#175CD3" font-family="Menlo, monospace">/.well-known/</text>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#175CD3" font-family="Menlo, monospace">assetlinks.json</text>

  <line x1="476" y1="118" x2="536" y2="118" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="540" y="70" width="190" height="96" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="635" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2939">③ 비교</text>
  <text x="635" y="122" text-anchor="middle" font-size="12" fill="#475467">파일 속 패키지명과</text>
  <text x="635" y="140" text-anchor="middle" font-size="12" fill="#475467">서명 SHA-256이</text>
  <text x="635" y="158" text-anchor="middle" font-size="12" fill="#475467">설치된 앱과 같은가</text>

  <line x1="600" y1="166" x2="520" y2="214" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="166" x2="670" y2="214" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="548" y="186" text-anchor="middle" font-size="12" fill="#067647">일치</text>
  <text x="700" y="198" text-anchor="middle" font-size="12" fill="#B42318">불일치·404</text>

  <rect x="400" y="218" width="190" height="60" rx="12" fill="#ECFDF3" stroke="#ABEFC6"/>
  <text x="495" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#067647">verified</text>
  <text x="495" y="264" text-anchor="middle" font-size="12" fill="#067647">링크를 누르면 앱이 열림</text>

  <rect x="606" y="218" width="134" height="60" rx="12" fill="#FEF3F2" stroke="#FECDCA"/>
  <text x="673" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#B42318">미검증</text>
  <text x="673" y="264" text-anchor="middle" font-size="12" fill="#B42318">브라우저로 열림</text>

  <rect x="30" y="218" width="340" height="112" rx="12" fill="#FFFAEB" stroke="#FEDF89"/>
  <text x="50" y="246" font-size="13" font-weight="700" fill="#93370D">주의할 점</text>
  <text x="50" y="270" font-size="12" fill="#93370D">• 검증은 링크를 누를 때가 아니라 설치 시점에 함</text>
  <text x="50" y="292" font-size="12" fill="#93370D">• 서버 파일보다 앱이 먼저 배포되면 검증 실패</text>
  <text x="50" y="314" font-size="12" fill="#93370D">• Play 앱 서명을 쓰면 지문이 두 개 필요할 수 있음</text>
</svg>
