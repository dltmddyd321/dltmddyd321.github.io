<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="760" height="470" rx="16" fill="#FFFFFF"/>

  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1D2939">초대 링크 하나로 이어지는 흐름</text>

  <rect x="30" y="64" width="200" height="70" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="130" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2939">공유하는 사람</text>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#475467">서버에서 초대 키 발급</text>

  <line x1="230" y1="99" x2="280" y2="99" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="284" y="64" width="446" height="70" rx="12" fill="#EFF8FF" stroke="#B2DDFF"/>
  <text x="507" y="92" text-anchor="middle" font-size="13" fill="#175CD3" font-family="Menlo, monospace">https://links.example.com/invite/{key}</text>
  <text x="507" y="114" text-anchor="middle" font-size="12" fill="#475467">메신저로 전달 → 받는 사람이 탭</text>

  <line x1="400" y1="134" x2="200" y2="180" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="580" y2="180" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="190" y="160" text-anchor="middle" font-size="12" fill="#067647">앱 설치 + 검증됨</text>
  <text x="660" y="166" text-anchor="middle" font-size="12" fill="#B54708">앱 없음 · 인앱 브라우저</text>

  <rect x="30" y="184" width="340" height="62" rx="12" fill="#ECFDF3" stroke="#ABEFC6"/>
  <text x="200" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#067647">앱이 바로 열림</text>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#067647">주소 경로에서 초대 키를 꺼냄</text>

  <rect x="400" y="184" width="330" height="62" rx="12" fill="#FEF6EE" stroke="#F9DBAF"/>
  <text x="565" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#B54708">같은 주소의 웹 페이지</text>
  <text x="565" y="230" text-anchor="middle" font-size="12" fill="#B54708">'앱으로 열기' 버튼 표시</text>

  <line x1="200" y1="246" x2="200" y2="282" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="565" y1="246" x2="565" y2="282" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="286" width="340" height="62" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="200" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2939">서버에 키 확인</text>
  <text x="200" y="332" text-anchor="middle" font-size="12" fill="#475467">만료·이미 참여 등은 안내 메시지</text>

  <rect x="400" y="286" width="330" height="62" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="565" y="310" text-anchor="middle" font-size="11" fill="#1D2939" font-family="Menlo, monospace">intent://links.example.com/invite/{key}</text>
  <text x="565" y="328" text-anchor="middle" font-size="11" fill="#1D2939" font-family="Menlo, monospace">#Intent;scheme=https;package=…;end</text>

  <line x1="200" y1="348" x2="200" y2="384" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="348" x2="330" y2="384" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="348" x2="640" y2="384" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="380" text-anchor="middle" font-size="12" fill="#067647">앱 있음</text>
  <text x="690" y="374" text-anchor="middle" font-size="12" fill="#B54708">앱 없음</text>

  <rect x="30" y="388" width="340" height="56" rx="12" fill="#ECFDF3" stroke="#ABEFC6"/>
  <text x="200" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#067647">초대 수락 다이얼로그</text>

  <rect x="550" y="388" width="180" height="56" rx="12" fill="#F9FAFB" stroke="#D0D5DD"/>
  <text x="640" y="412" text-anchor="middle" font-size="13" fill="#1D2939">스토어로 이동</text>
  <text x="640" y="431" text-anchor="middle" font-size="11" fill="#667085">설치 후 링크를 다시 탭</text>
</svg>
